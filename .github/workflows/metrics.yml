name: profile-metrics

# 每天 03:17 + 每次 push + 手动触发：在本仓生成统计卡 metrics.classic.svg 并自动提交。
# 图片走 raw.githubusercontent.com（GitHub 域名，经 camo 代理），不依赖公共 Vercel 实例。
# token 优先用自定义 PAT（secrets.METRICS_TOKEN，可读全部公开仓/组织），未配置时退回 GITHUB_TOKEN。
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@3.34.0
        with:
          filename: metrics.classic.svg
          user: bestksl
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
